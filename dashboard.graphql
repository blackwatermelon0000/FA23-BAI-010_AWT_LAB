# Student dashboard: the student's details and every booking (with room name,
# date and time) in ONE request. Run it in Apollo Sandbox at http://localhost:3000/graphql
# with the variables: { "regNo": "FA23-BAI-010" }

query StudentDashboard($regNo: String!) {
  student(regNo: $regNo) {
    regNo
    name
    email
    bookings {
      slotId
      roomCode
      roomName
      date
      startHour
      endHour
      bookedAt
    }
  }
}
